version: "3"

services:
  tor:
    container_name: tor
    build:
      context: tor
    image: tor
    cap_add:
      - SYS_TIME
    ports:
      - 9050:9050
      - 9051:9051

  btc_sig_miner:
    container_name: btc_sig_miner
    build:
      context: bitcoind_signet_miner_plugnplay
    image: bitcoind_signet_miner
    environment:
      - BLOCK_MINING_SEC=10
      - POISSON=false
    volumes:
      - shared_vol_btc:/bitcoind
    depends_on:
      - tor
    stop_grace_period: 1m
    ports:
      - 38332:38332
      - 38333:38333

  electrs-romanz:
    container_name: electrs-romanz
    build:
      context: electrs-romanz
    image: electrs_romanz
    volumes:
      - shared_vol_btc:/bitcoind
    depends_on:
      btc_sig_miner:
        condition: service_healthy
    ports:
      - 60601:60601

  # Blockstream electrs (bitcoin)
  electrs-blockstream:
    container_name: electrs-blockstream
    build:
      context: electrs-blockstream
    image: electrs_blockstream
    volumes:
      - shared_vol_electrs_blockstream:/electrum
    depends_on:
      btc_sig_miner:
        condition: service_healthy
    ports:
      - 3000:3000
      - 60501:60601

  # Bitcoin Esplora
  esplora-bitcoin:
    container_name: esplora
    build: 
      context: esplora
    image: esplora
    volumes:
      - shared_vol_esplora_bitcoin:/app
    depends_on:
      - electrs-blockstream
      - nginx
    environment:
      - FLAVOR=bitcoin-signet
      - PORT=8000

  nginx:
    container_name: nginx
    image: nginx:1.27
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/docker-entrypoint.d/05-defaults.envsh:/docker-entrypoint.d/05-defaults.envsh:ro
      - ./nginx/docker-entrypoint.d/10-selfsigned-cert.sh:/docker-entrypoint.d/10-selfsigned-cert.sh:ro
    ports:
      - 60602:60602
      - 60502:60502
      - 8080:8080
      - 9090:9090

  cln:
    container_name: cln
    build:
      context: c-lightning
    image: c-lightning
    volumes:
      - shared_vol_ln:/lightningd
    environment:
      - BTC_HOST=btc_sig_miner
      - CLN_PORT=39735
      - CLNREST_PORT=3010
    ports:
      - 39735:39735
      - 3010:3010
    depends_on:
      btc_sig_miner:
        condition: service_healthy
      tor:
        condition: service_started

  cln2:
    container_name: cln2
    build:
      context: c-lightning
    image: c-lightning
    volumes:
      - shared_vol_ln2:/lightningd
    environment:
      - BTC_HOST=btc_sig_miner
      - CLN_PORT=39736
      - CLNREST_PORT=3011
    ports:
      - 39736:39736
      - 3011:3011
    depends_on:
      btc_sig_miner:
        condition: service_healthy
      tor:
        condition: service_started

  faucet:
    container_name: faucet
    build:
      context: faucet
    image: faucet
    environment:
      - BTC_HOST=btc_sig_miner
      - FAUCET_MAX_AMOUNT=10
    depends_on:
      btc_sig_miner:
        condition: service_healthy
      tor:
        condition: service_started
    ports:
      - 5000:5000

  gl-testserver:
    container_name: gl-testserver
    build:
      context: gl-testserver
    image: gl-testserver
    platform: linux/amd64
    init: true
    sysctls:
      - net.ipv4.ip_local_port_range=40000 40199
      - net.ipv4.tcp_tw_reuse=1
    environment:
      - GL_TESTSERVER_BITCOIND_RPC=http://bitcoin:bitcoin@btc_sig_miner:38332
      - GL_TESTING_ADVERTISE_HOST=${GL_ADVERTISE_HOST:-0.0.0.0}
      - GL_TESTING_BIND_HOST=0.0.0.0
      - GL_TESTING_SCHEDULER_PORT=2601
    ports:
      - 2601:2601
      - 40000-40199:40000-40199
    volumes:
      - ./gl-testserver/data:/data
      - shared_vol_gl_clnvm:/opt/clnvm
    depends_on:
      btc_sig_miner:
        condition: service_healthy
      cln:
        condition: service_started

volumes:
  shared_vol_btc:
  shared_vol_ln:
  shared_vol_ln2:
  shared_vol_mempool_db:
  shared_vol_mempool_api:
  shared_vol_electrs_blockstream:
  shared_vol_esplora_bitcoin:
  shared_vol_gl_clnvm:

networks:
  btc-testing-tools:
    driver: bridge